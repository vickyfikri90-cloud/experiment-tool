<!doctype html><html><head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script src="../bundle.js"></script><meta charset="utf-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@500&family=Inter:wght@100..900&display=swap" rel="stylesheet"><style>html,body{margin:0;background:var(--surface);font-family:var(--font-sans);}.stage{display:flex;gap:24px;padding:16px 0;align-items:flex-start;flex-wrap:wrap}.stage>.col{width:240px}</style></head><body>
<div id="app" style="height:420px;padding:8px;box-sizing:border-box"><div class="cp-app"><div class="cp-preview"><div class="cp-preview-box" id="box" style="padding:16px 24px;border-radius:5px">Hover here</div></div><aside class="panel" data-control-panel><div class="field"><label class="field-label" for="lbl">Text label</label><div class="row"><div class="input-wrap input-wrap--label"><input type="text" id="lbl" value="Hover here"></div></div></div><div id="bg"><div class="field">
  <span class="field-label">Background color</span>
  <div class="row">
    <div class="input-wrap color-wrap">
      <span class="swatch" data-color-swatch></span>
      <input type="text" data-color-hex value="F0F0F0">
      <div class="opacity-wrap">
        <input type="text" data-color-opacity value="100">
        <span class="opacity-suffix">%</span>
      </div>
    </div>
  </div>
  <div class="color-preview" data-color-preview></div>
</div></div><div id="dv"><div class="panel-divider">
  <span class="panel-divider__line" role="separator"></span>
</div></div><div id="sl" style="margin:8px 0 16px"><div class="slider-field">
  <span class="slider-field__label">Radius</span>
  <div class="slider-field__row">
    <div class="slider-value-wrap">
      <input type="text" class="slider-value-input" value="5" inputmode="numeric">
    </div>
    <div class="slider-track-wrap">
      <div class="slider-track">
        <div class="slider-fill"></div>
        <button type="button" class="slider-thumb" aria-label="Slider"></button>
      </div>
    </div>
  </div>
</div></div><div id="tg"><div class="field toggle-field">
  <span class="field-label">Toggle</span>
  <div class="toggle-stack">
    <button type="button" class="toggle-row is-on" role="switch" aria-checked="true">
      <span class="toggle-switch" aria-hidden="true">
        <span class="toggle-switch__knob"></span>
      </span>
      <span class="toggle-row__label">Toggle On</span>
    </button>
    <button type="button" class="toggle-row" role="switch" aria-checked="false">
      <span class="toggle-switch" aria-hidden="true">
        <span class="toggle-switch__knob"></span>
      </span>
      <span class="toggle-row__label">Toggle Off</span>
    </button>
    <button type="button" class="toggle-row is-disabled" role="switch" aria-checked="false" disabled>
      <span class="toggle-switch" aria-hidden="true">
        <span class="toggle-switch__knob"></span>
      </span>
      <span class="toggle-row__label">Toggle Disabled</span>
    </button>
  </div>
</div></div></aside></div></div>
<script>
(function(){var K=window.ExperimentKit;
var panel=K.ControlPanel(document.getElementById('app'));var box=document.getElementById('box');
var bg=K.ColorInput(document.getElementById('bg'),{onChange:apply});
var r=K.Slider(document.getElementById('sl'),{min:0,max:24,value:5,onChange:apply});
K.Toggle(document.getElementById('tg'));
var lbl=document.getElementById('lbl');lbl.addEventListener('input',apply);K.utils.bindInputWrapInputs(document);
function apply(){box.textContent=lbl.value;box.style.background=bg.getColor();box.style.borderRadius=r.getValue()+'px';}
apply();
})();
</script></body></html>
