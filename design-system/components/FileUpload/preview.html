<!doctype html><html><head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script src="../bundle.js"></script><meta charset="utf-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@500&family=Inter:wght@100..900&display=swap" rel="stylesheet"><style>html,body{margin:0;background:var(--surface);font-family:var(--font-sans);}.stage{display:flex;gap:24px;padding:16px 0;align-items:flex-start;flex-wrap:wrap}.stage>.col{width:240px}</style></head><body>
<div class="stage"><div class="col" id="a"><div class="field file-upload">
  <span class="field-label">File</span>
  <div class="row">
    <div class="input-wrap file-upload__wrap" role="button" tabindex="0" aria-label="Choose file">
      <span class="input-icon"><img src="" alt="" data-icon="file"></span>
      <span class="file-upload__name" data-upload-name>Choose file</span>
      <span class="upload-meta" data-upload-meta></span>
      <button type="button" class="upload-clear" data-upload-clear aria-label="Remove file" hidden><img src="" alt="" data-icon="close"></button>
      <input type="file" class="upload-file-input" tabindex="-1" aria-hidden="true">
    </div>
  </div>
</div></div><div class="col" id="b"><div class="field file-upload">
  <span class="field-label">Snippet source</span>
  <div class="row">
    <div class="input-wrap file-upload__wrap" role="button" tabindex="0" aria-label="Choose file">
      <span class="input-icon"><img src="" alt="" data-icon="file"></span>
      <span class="file-upload__name" data-upload-name>Choose file</span>
      <span class="upload-meta" data-upload-meta></span>
      <button type="button" class="upload-clear" data-upload-clear aria-label="Remove file" hidden><img src="" alt="" data-icon="close"></button>
      <input type="file" class="upload-file-input" tabindex="-1" aria-hidden="true">
    </div>
  </div>
</div></div></div>
<script>
(function(){var K=window.ExperimentKit;
function sample(i,w,h){var c=document.createElement('canvas');c.width=w||240;c.height=h||240;var x=c.getContext('2d');
var bg=['#23272e','#f5f5f5','#4372ff','#000000','#eeeeee','#2952cc'][i%6];var fg=['#4372ff','#23272e','#ffffff','#f5f5f5','#23272e','#f5f5f5'][i%6];
x.fillStyle=bg;x.fillRect(0,0,c.width,c.height);x.fillStyle=fg;
if(i%3===0){x.beginPath();x.arc(c.width*.62,c.height*.45,c.height*.28,0,Math.PI*2);x.fill();}
else if(i%3===1){x.fillRect(c.width*.18,c.height*.3,c.width*.64,c.height*.4);}
else{for(var r=0;r<4;r++){x.fillRect(c.width*.15,c.height*(.2+r*.17),c.width*(.7-r*.12),c.height*.1);}}
return c.toDataURL('image/png');}
K.FileUpload(document.getElementById('a'),{accept:'.html,.css,.js'});var b=K.FileUpload(document.getElementById('b'),{accept:'.html,.css,.js'});b.setFile(new File([new Array(24577).join('x')],'button-hover.html',{type:'text/html'}));
})();
</script></body></html>
