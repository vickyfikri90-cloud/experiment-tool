<!doctype html><html><head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script src="../bundle.js"></script><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:var(--surface);}
.cover{position:relative;width:960px;height:288px;overflow:hidden;background:var(--surface);}
svg{position:absolute;inset:0;}
.slab{fill:var(--control-fill);}
.menu{fill:var(--menu-bg);}
.hue{fill:var(--bezier-handle);}
.tile{fill:var(--input-bg);rx:var(--radius-control);}
.text{position:absolute;left:40px;bottom:32px;max-width:440px;}
.name{margin:0;font-family:var(--font-sans);font-weight:600;font-size:72px;line-height:.95;letter-spacing:-1px;color:var(--ink);}
.tag{margin:16px 0 0;font-family:var(--font-sans);font-weight:500;font-size:13px;line-height:16px;color:var(--ink-muted);}
</style></head><body>
<div class="cover">
  <svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
    <!-- blocks: control-fill slab 280×288 (bleeds top+bottom), menu-bg 80×160 (bleeds top+right), bezier-handle 80×80 (bleeds bottom) -->
    <!-- arrangement: one tall slab with two satellites, flush like the panel docked beside the preview -->
    <!-- pattern: geometric, modular, dense UI → the panel's own 24px control rows (some split two-up like .row) cut in input-bg across the slab -->
    <!-- scales: control-height 24px rows, row-gap 8px pitch, field-gap/field-padding-x 16px+8px insets, radius-control 5px corners -->
    <rect class="slab" x="600" y="0" width="280" height="288"/>
    <rect class="menu" x="880" y="0" width="80" height="160"/>
    <rect class="hue" x="520" y="208" width="80" height="80"/>
    <rect class="tile" x="624" y="24" width="232" height="24"/>
    <rect class="tile" x="624" y="56" width="112" height="24"/>
    <rect class="tile" x="744" y="56" width="112" height="24"/>
    <rect class="tile" x="624" y="88" width="232" height="24"/>
    <rect class="tile" x="624" y="120" width="176" height="24"/>
    <rect class="tile" x="808" y="120" width="48" height="24"/>
    <rect class="tile" x="624" y="152" width="232" height="24"/>
    <rect class="tile" x="624" y="184" width="112" height="24"/>
    <rect class="tile" x="744" y="184" width="112" height="24"/>
    <rect class="tile" x="624" y="216" width="232" height="24"/>
    <rect class="tile" x="624" y="248" width="232" height="24"/>
  </svg>
  <div class="text"><h1 class="name">Experiment<br>Tool</h1><p class="tag">Figma-style controls for live UI experiments.</p></div>
</div>
</body></html>
