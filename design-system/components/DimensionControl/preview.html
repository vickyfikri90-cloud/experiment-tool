<!doctype html><html><head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script src="../bundle.js"></script><meta charset="utf-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@500&family=Inter:wght@100..900&display=swap" rel="stylesheet"><style>html,body{margin:0;background:var(--surface);font-family:var(--font-sans);}.stage{display:flex;gap:24px;padding:16px 0;align-items:flex-start;flex-wrap:wrap}.stage>.col{width:240px}</style></head><body>
<div class="stage"><div class="col"><div class="field"><span class="field-label">Size</span><div class="row" id="g"><div class="input-wrap input-wrap--dimension" data-dimension-id="width">
  <span class="input-icon">W</span>
  <div class="dimension-control">
    <span class="dimension-mode-label">Hug (0)</span>
    <input type="text" class="dimension-fixed-input" value="160">
  </div>
  <span class="chevron-wrap dimension-chevron" role="button" tabindex="0" aria-label="Width mode">
    <img src="" alt="" data-icon="chevron">
  </span>
  <div class="dimension-menu">
    <button type="button" data-dimension-mode="fixed">Fixed</button>
    <button type="button" data-dimension-mode="hug">Hug Content</button>
  </div>
</div><div class="input-wrap input-wrap--dimension" data-dimension-id="height">
  <span class="input-icon">H</span>
  <div class="dimension-control">
    <span class="dimension-mode-label">Hug (0)</span>
    <input type="text" class="dimension-fixed-input" value="160">
  </div>
  <span class="chevron-wrap dimension-chevron" role="button" tabindex="0" aria-label="Height mode">
    <img src="" alt="" data-icon="chevron">
  </span>
  <div class="dimension-menu">
    <button type="button" data-dimension-mode="fixed">Fixed</button>
    <button type="button" data-dimension-mode="hug">Hug Content</button>
  </div>
</div></div></div></div></div>
<script>
(function(){var K=window.ExperimentKit;
K.DimensionControlGroup(document.getElementById('g'),{width:{initialMode:'hug',measure:function(){return 160}},height:{initialMode:'fixed',measure:function(){return 48}}});
})();
</script></body></html>
